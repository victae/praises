<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤝 찬양 동역자 업로드 대기실</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --accent: #1565c0;
            --text: #37474f;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .upload-container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
        }
        h2 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #455a64;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        textarea {
            height: 180px;
            resize: vertical;
            font-family: inherit;
        }
        input[type="file"] {
            display: none;
        }
        .file-custom {
            display: block;
            padding: 12px;
            background: #cfd8dc;
            color: #37474f;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .file-custom:hover {
            background: #b0bec5;
        }
        .file-name-display {
            margin-top: 6px;
            font-size: 13px;
            color: var(--accent);
            text-align: center;
            word-break: break-all;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }
        .btn-submit:hover {
            background-color: #1b5e20;
        }
        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: none;
            padding: 10px;
            border-radius: 6px;
        }
        .status-msg.success { color: #1b5e20; background: #e8f5e9; }
        .status-msg.error { color: #b71c1c; background: #ffebee; }
        
        /* 충돌 화면 및 성공 화면 스타일 정의 */
        .preview-img { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; max-height: 200px; }
        .lyrics-box { background: #f1f3f4; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; text-align: left; max-height: 150px; overflow-y: auto; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="upload-container">
    <h2>🤝 찬양 검수 대기실 등록</h2>
    
    <div id="mainFormView">
        <div class="form-group">
            <label for="titleInput">🎼 찬양 제목</label>
            <input type="text" id="titleInput" placeholder="예: 은혜로다 (오타 없이 명확하게)">
        </div>

        <div class="form-group">
            <label for="lyricsInput">📝 찬양 가사</label>
            <textarea id="lyricsInput" placeholder="1절, 2절, 후렴 등을 정확히 구분하여 입력해 주세요."></textarea>
        </div>

        <div class="form-group">
            <label>🎼 악보 이미지 (선택)</label>
            <label for="imageInput" class="file-custom">파일 선택하기 📂</label>
            <input type="file" id="imageInput" accept="image/*" onchange="displayFileName()">
            <div class="file-name-display" id="fileName">선택된 파일이 없습니다.</div>
        </div>

        <button class="btn-submit" onclick="checkConflictAndUpload()">검수 대기실로 등록하기 🚀</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div id="conflictView" style="display: none;">
        <h3 style="color:#c62828; margin-top:0;">⚠️ 이미 등록된 곡입니다!</h3>
        <p style="font-size:14px; color:#555;">정식 라이브러리에 저장된 찬양과 중복을 확인해 주세요.</p>
        
        <h4 style="margin-bottom:5px; text-align:left;">📋 기존 가사:</h4>
        <div class="lyrics-box" id="existingLyrics"></div>
        
        <div id="existingImageArea"></div>
        <hr style="border: 0; border-top: 1px solid #cfd8dc; margin: 20px 0;">
        
        <div id="conflictActionArea">
            <button class="btn-submit" style="background:#0288d1; margin-bottom:10px;" onclick="showSourceEditForm()">인도자/출처가 다른 같은 제목의 곡입니다 🎤</button>
            <button class="btn-submit" style="background:#78909c;" onclick="resetToMain()">뒤로가기 (처음으로)</button>
        </div>
        
        <div id="sourceEditArea" style="display: none;">
            <div class="form-group">
                <label for="newSourceInput">🎤 새로운 인도자 또는 출처 단어 입력</label>
                <input type="text" id="newSourceInput" placeholder="예: 마커스, 어노인팅, 웰러브">
            </div>
            <button class="btn-submit" style="background:#2e7d32; margin-bottom:10px;" onclick="retryUploadWithNewSource()">출처 포함하여 대기실 재등록 🚀</button>
            <button class="btn-submit" style="background:#78909c;" onclick="resetToMain()">취소</button>
        </div>
    </div>

    <div id="successView" style="display: none; text-align: center;">
        <h3 style="color:#2e7d32;" id="successTitle">🎉 등록 신청 완료!</h3>
        <p id="successMsgText" style="line-height: 1.6; color:#37474f;"></p>
        <button class="btn-submit" style="background:#2e7d32; margin-top:20px;" onclick="resetToMain()">새로운 찬양 등록하기 ➕</button>
    </div>
</div>

<script>
// =================================================================
// 🔐 고정 로그인 및 토큰 영역 (이 구역에 토큰을 안전하게 쪼개어 세팅하세요!)
// =================================================================
const ADMIN_ID = "praise";     
const ADMIN_PW = "1004";     

const t1 = "ghp_r0exLAooKD5MIq"; 
const t2 = "05FUeC7rW8XIUJ"; 
const t3 = "782Aw8KF"; 
const REAL_TOKEN = t1 + t2 + t3;

const REPO_OWNER = "victae";
const REPO_NAME = "praises";
const GITHUB_TOKEN = t1 + t2 + t3;
// =================================================================

function displayFileName() {
    const fileInput = document.getElementById('imageInput');
    const display = document.getElementById('fileName');
    if(fileInput.files.length > 0) {
        display.innerText = `📄 선택된 악보: ${fileInput.files[0].name}`;
    } else {
        display.innerText = "선택된 파일이 없습니다.";
    }
}

// [1] 최초 등록 시도 버튼 클릭시 실행
async function checkConflictAndUpload() {
    const title = document.getElementById('titleInput').value.trim();
    const lyrics = document.getElementById('lyricsInput').value.trim();
    
    if (!title || !lyrics) {
        showStatus("⚠️ 제목과 가사는 필수 입력 사항입니다.", "error");
        return;
    }

    showStatus("기존 등록 여부 검사 중... 🔍", "success");

    // 검사는 정식 등록 폴더(lyrics/)에 이미 똑같은 노래가 있는지 확인합니다.
    const textUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/lyrics/${title}.txt`;

    try {
        const response = await fetch(textUrl, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });

        if (response.status === 200) {
            const data = await response.json();
            const existingLyricsText = decodeURIComponent(escape(atob(data.content)));
            showConflictView(title, existingLyricsText);
        } else if (response.status === 404) {
            executeUpload(title, lyrics);
        } else {
            showStatus("❌ 통신 중 오류가 발생했습니다. (토큰 체크 필요)", "error");
        }
    } catch (error) {
        console.error(error);
        showStatus("❌ 오류가 발생했습니다. 다시 시도해 주세요.", "error");
    }
}

// [2] 충돌 화면 보여주기
function showConflictView(title, existingLyricsText) {
    document.getElementById('mainFormView').style.display = 'none';
    document.getElementById('conflictView').style.display = 'block';
    
    document.getElementById('existingLyrics').innerText = existingLyricsText;
    
    const imgArea = document.getElementById('existingImageArea');
    imgArea.innerHTML = "";
    
    const exts = ['jpg', 'png', 'gif', 'jpeg'];
    exts.forEach(ext => {
        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/${title}.${ext}?v=${Date.now()}`;
        img.className = 'preview-img';
        img.onerror = () => img.style.display = 'none';
        imgArea.appendChild(img);
    });
}

// [3] 다른 곡 선언 시 출처 적는 칸 유도
function showSourceEditForm() {
    document.getElementById('conflictActionArea').style.display = 'none';
    document.getElementById('sourceEditArea').style.display = 'block';
}

// [4] 새 출처 정보를 받아서 재조합 후 업로드
function retryUploadWithNewSource() {
    const originalTitle = document.getElementById('titleInput').value.trim();
    const lyrics = document.getElementById('lyricsInput').value.trim();
    const newSource = document.getElementById('newSourceInput').value.trim();

    if (!newSource) {
        alert("새로운 출처 단어(예: 마커스)를 입력해 주세요.");
        return;
    }

    let pureTitle = originalTitle;
    if (originalTitle.includes('-')) {
        pureTitle = originalTitle.split('-')[0].trim();
    }
    
    const finalNewTitle = `${pureTitle}-${newSource}`;
    executeUpload(finalNewTitle, lyrics);
}

// [5] 실제 깃허브 업로드 처리 최종 실행자
async function executeUpload(targetTitle, lyricsContent) {
    const fileInput = document.getElementById('imageInput');
    
    document.getElementById('conflictView').style.display = 'none';
    document.getElementById('mainFormView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
    document.getElementById('successMsgText').innerText = "데이터 대기실에 등록을 진행 중입니다... 🚀";

    try {
        // 1. 가사 텍스트 저장 ➡️ 'admin_lyrics' 임시 대기실 폴더매핑
        const textContent = btoa(unescape(encodeURIComponent(lyricsContent)));
        const textUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_lyrics/${targetTitle}.txt`;
        
        await fetch(textUrl, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `➕ 대기실 가사 추가: ${targetTitle}`, content: textContent })
        });

        // 2. 이미지 파일 연동 처리 ➡️ 'admin_images' 임시 대기실 폴더매핑
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const ext = file.name.split('.').pop();
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const imgContent = e.target.result.split(',')[1];
                const imgUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_images/${targetTitle}.${ext}`;
                
                await fetch(imgUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `➕ 대기실 악보 추가: ${targetTitle}`, content: imgContent })
                });
                
                showFinalSuccess(targetTitle, true);
            };
            reader.readAsDataURL(file);
        } else {
            showFinalSuccess(targetTitle, false);
        }
    } catch (e) {
        alert("업로드 과정 중 통신 장애가 발생했습니다.");
        resetToMain();
    }
}

// [6] 최종 성공 화면 유도
function showFinalSuccess(finalTitle, hasImg) {
    document.getElementById('successMsgText').innerHTML = `
        <strong>[ ${finalTitle} ]</strong><br><br>
        검수 대기실에 안전하게 상차 완료되었습니다.<br>
        이제 관리자 검수창(realadmin)에서 승인하면 앱에 최종 배포됩니다.<br><br>
        ${hasImg ? '✨ 📝 임시 가사 및 🎼 임시 악보 대기실 적재 완료' : '✨ 📝 임시 가사 대기실 적재 완료 (악보 없음)'}
    `;
}

// [7] 초기화 후 처음으로 돌아가기
function resetToMain() {
    document.getElementById('titleInput').value = '';
    document.getElementById('lyricsInput').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('newSourceInput').value = '';
    
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = '';
    statusMsg.style.display = 'none';

    document.getElementById('sourceEditArea').style.display = 'none';
    document.getElementById('conflictActionArea').style.display = 'block';
    document.getElementById('successView').style.display = 'none';
    document.getElementById('conflictView').style.display = 'none';
    document.getElementById('mainFormView').style.display = 'block';
    document.getElementById('fileName').innerText = '선택된 파일이 없습니다.';
}

function showStatus(msg, type) {
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = msg;
    statusMsg.className = `status-msg ${type}`;
    statusMsg.style.display = 'block';
}
</script>
</body>
</html>
