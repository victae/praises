<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praise Knock - 동역자 업로드 Admin</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f5f7f6; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 600px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #1e3d2f; }
        h2 { color: #1e3d2f; margin-top: 0; text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 14px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: #1e3d2f; }
        textarea { height: 180px; resize: vertical; line-height: 1.6; }
        .hint { font-size: 12px; color: #666; margin-top: 4px; }
        .btn-submit { width: 100%; padding: 15px; background-color: #1e3d2f; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #2e5a44; }
        .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
        .success { background-color: #e8f5e9; color: #2e7d32; }
        .error { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>🎼 새 찬양 데이터 등록 (임시 계측)</h2>
    
    <div class="form-group">
        <label for="titleInput">찬양 제목 (출처 규칙 필수)</label>
        <input type="text" id="titleInput" placeholder="예: 원하고 바라고 기도합니다 - 마커스">
        <div class="hint">⚠️ 동명이곡 방지를 위해 하이픈(-) 뒤에 꼭 출처(물소리, 찬미예수2000 등)를 적어주세요.</div>
    </div>

    <div class="form-group">
        <label for="lyricsInput">가사 본문 입력</label>
        <textarea id="lyricsInput" placeholder="찬양 가사를 단락에 맞춰 입력해 주세요."></textarea>
    </div>

    <div class="form-group">
        <label for="imageInput">악보 이미지 선택</label>
        <input type="file" id="imageInput" accept="image/*">
        <div class="hint">지원 확장자: jpg, png, gif 등 (서버에서 고효율 jpg로 자동 전환 예정)</div>
    </div>

    <button class="btn-submit" onclick="uploadToStaging()">검수 대기실로 등록하기 🚀</button>
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
// ⚠️ 발급받으신 토큰 정보와 본인의 깃허브 정보를 정확하게 입력하세요.
const GITHUB_TOKEN = "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";
const REPO_OWNER = "victae"; 
const REPO_NAME = "praises";     

async function uploadToStaging() {
    const title = document.getElementById('titleInput').value.trim();
    const lyrics = document.getElementById('lyricsInput').value.trim();
    const imageFile = document.getElementById('imageInput').files[0];
    const statusMsg = document.getElementById('statusMsg');

    if (!title || !lyrics || !imageFile) {
        showStatus("모든 항목(제목, 가사, 이미지)을 입력해야 합니다.", "error");
        return;
    }

    showStatus("깃허브 대기실에 등록하는 중입니다... 잠시만 기다려주세요.", "success");

    try {
        // 1. 가사 텍스트 파일 생성 (admin_lyrics/[제목].txt)
        const lyricsContentBase64 = btoa(unescape(encodeURIComponent(lyrics)));
        const lyricsUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_lyrics/${title}.txt`;
        
        await fetch(lyricsUrl, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `📝 동역자 등록: ${title} 가사 임시 저장`, content: lyricsContentBase64 })
        });

        // 2. 이미지 파일 Base64 변환 후 생성 (admin_images/[제목].확장자)
        const fileExt = imageFile.name.split('.').pop();
        const reader = new FileReader();
        reader.readAsDataURL(imageFile);
        reader.onload = async function () {
            const imageBase64 = reader.result.split(',')[1];
            const imageUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_images/${title}.${fileExt}`;
            
            const imgRes = await fetch(imageUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `🖼️ 동역자 등록: ${title} 악보 임시 저장`, content: imageBase64 })
            });

            if (imgRes.ok) {
                showStatus("🎉 검수 대기실에 성공적으로 등록되었습니다! 관리자 승인 후 앱에 반영됩니다.", "success");
                document.getElementById('titleInput').value = '';
                document.getElementById('lyricsInput').value = '';
                document.getElementById('imageInput').value = '';
            } else {
                throw new Error("이미지 업로드 실패");
            }
        };

    } catch (error) {
        showStatus("업로드 중 오류가 발생했습니다: " + error.message, "error");
    }
}

function showStatus(msg, type) {
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = msg;
    statusMsg.className = "status-msg " + type;
    statusMsg.style.display = "block";
}
</script>
</body>
</html>
