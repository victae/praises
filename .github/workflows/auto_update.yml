name: Auto Praise Update Engine

on:
  push:
    paths:
      - 'lyrics/**'
      - 'images/**'

jobs:
  update-praise:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 깃허브 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 설정하기
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. 이미지 압축 라이브러리(Pillow) 설치
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: 4. 악보 자동 변환 및 중복 청소 엔진 가동
      run: |
        # 💡 경로를 서버 환경에 맞게 상대경로로 자동 변경하여 실행합니다.
        python convert_bmp_to_jpg_server.py || true
        python clean_duplicate_scores_server.py || true
        python make_json_server.py || true

    - name: 5. 로봇이 최신화한 파일들을 저장소에 자동으로 반영하기
      run: |
        git config --global user.name "Praise-Bot"
        git config --global user.email "bot@praiseknock.com"
        git add .
        # 변경사항이 있을 때만 저장합니다.
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 시스템: 새 찬양 업로드 감지 - 자동 최적화 및 인덱싱 완료 [Skip CI]" && git push)