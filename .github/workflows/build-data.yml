name: Generate CCM Data

on:
  push:
    paths:
      - 'lyrics/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate JSON Data
        run: |
          python -c "
          import os
          import json

          ccm_list = []
          lyrics_dir = 'lyrics'

          if os.path.exists(lyrics_dir):
              files = sorted([f for f in os.listdir(lyrics_dir) if f.endswith('.txt')])
              for idx, filename in enumerate(files, start=1):
                  filepath = os.path.join(lyrics_dir, filename)
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f:
                          lines = f.readlines()
                      
                      title = os.path.splitext(filename)[0]
                      info = lines[0].strip() if len(lines) > 0 else ''
                      lyrics = ' '.join([line.strip() for line in lines[1:]]) if len(lines) > 1 else ''

                      ccm_list.append({
                          'no': str(idx),
                          'title': title,
                          'info': info,
                          'lyrics': lyrics
                      })
                  except Exception as e:
                      print(f'Error reading {filename}: {e}')

          with open('ccm_data.json', 'w', encoding='utf-8') as json_file:
              json.dump(ccm_list, json_file, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ccm_data.json
          if [ -n "$(git status --porcelain ccm_data.json)" ]; then
            git commit -m "🤖 자동 업데이트: ccm_data.json 갱신"
            git push
          else
            echo "변경 사항이 없습니다."
          fi
