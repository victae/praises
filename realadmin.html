<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 찬양 최고 관리자 검수실 (반응형)</title>
    <style>
        :root {
            --primary: #1565c0;
            --primary-light: #e3f2fd;
            --success: #2e7d32;
            --reject: #c62828;
            --text: #263238;
            --bg: #eceff1;
            --border: #cfd8dc;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 🟦 상단 헤더 */
        header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        header h1 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .badge-wrapper { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        #queueCount { background: var(--reject); color: white; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-left: 5px; }

        /* 🟦 메인 대시보드 구조 (기본값은 모바일을 고려해 flex-direction: column) */
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: calc(100vh - 54px);
            overflow: hidden;
        }

        /* ◀ 대기 리스트 사이드바 (모바일에서는 상단에 가로형 또는 적당한 높이로 배치) */
        .sidebar {
            width: 100%;
            max-height: 160px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            color: #455a64;
            font-size: 13px;
        }

        #queueList {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        #queueList li {
            padding: 12px 20px;
            border-bottom: 1px solid #f1f3f4;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            word-break: break-all;
            font-size: 14px;
        }

        #queueList li:hover { background-color: var(--primary-light); color: var(--primary); }
        #queueList li.active { background-color: #bbdefb; color: #0d47a1; font-weight: bold; }

        /* ▶ 오른쪽 메인 작업 패널 구역 */
        #mainPanel {
            flex: 1;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .no-data {
            margin: auto;
            text-align: center;
            color: #78909c;
            font-size: 15px;
            font-weight: 500;
            padding: 40px;
        }

        /* 🟩 실무 검수 워크스페이스 (기본 모바일: 상하 분할) */
        .workspace {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 12px;
            gap: 12px;
            overflow-y: auto;
        }

        .editor-section, .viewer-section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            min-height: 250px; /* 모바일에서 최소 높이 확보 */
        }

        h4 { margin-top: 0; margin-bottom: 10px; color: #37474f; font-size: 14px; border-left: 4px solid var(--primary); padding-left: 8px; display: flex; align-items: center; gap: 6px; }
        
        .title-view {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            color: #0d47a1;
        }

        /* 📝 가사 텍스트 에디터 창 */
        .lyrics-edit {
            flex: 1;
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            font-family: inherit;
        }

        .lyrics-edit:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* 🎼 악보 이미지 뷰어 박스 */
        .image-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
            border: 1px dashed var(--border);
            border-radius: 8px;
            overflow: auto;
            padding: 10px;
            min-height: 180px;
        }

        .sheet-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 🛠️ 하단 고정형 컨트롤 바 */
        .control-bar {
            background: white;
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-approve { background-color: var(--success); color: white; }
        .btn-approve:hover { background-color: #1b5e20; }
        .btn-reject { background-color: var(--reject); color: white; }
        .btn-reject:hover { background-color: #b71c1c; }

        /* ================================================================= */
        /* 💻 데스크탑 및 태블릿 가로 모드 전용 반응형 레이아웃 (화면 폭 768px 이상) */
        /* ================================================================= */
        @media (min-width: 768px) {
            header h1 { font-size: 20px; }
            .badge-wrapper { font-size: 14px; }

            .main-container {
                flex-direction: row; /* 좌우 분할로 변경 */
            }

            .sidebar {
                width: 320px;
                max-height: 100%;
                border-bottom: none;
                border-right: 1px solid var(--border);
            }

            .sidebar-header {
                padding: 15px 20px;
                font-size: 14px;
            }

            .workspace {
                flex-direction: row; /* 가사/악보 좌우 5:5 분할 */
                padding: 20px;
                gap: 20px;
                height: calc(100% - 70px);
                overflow: hidden;
            }

            .editor-section, .viewer-section {
                flex: 1;
                padding: 20px;
                min-height: auto;
            }

            h4 { font-size: 15px; margin-bottom: 12px; }
            .title-view { font-size: 16px; margin-bottom: 12px; padding: 10px 15px; }
            .lyrics-edit { font-size: 15px; padding: 15px; }
            .image-wrapper { min-height: auto; }

            .control-bar {
                padding: 15px 25px;
                justify-content: flex-end; /* 버튼 우측 정렬 */
                gap: 15px;
            }

            .btn {
                flex: initial; /* 모바일처럼 늘어나지 않고 글자 크기에 맞춤 */
                padding: 12px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>👑 찬양 최고 관리자 검수 패널</h1>
        <div class="badge-wrapper">검수 대기 곡:<span id="queueCount">0</span>개</div>
    </header>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="sidebar-header">📥 검수 대기실 파일</div>
            <ul id="queueList">
                <div style="padding:20px; text-align:center; color:#90a4ae;">대기 데이터를 가져오는 중...</div>
            </ul>
        </div>

        <div id="mainPanel">
            <div class="no-data">◀ 왼쪽 대기 목록에서 검수할 찬양을 선택해 주세요.</div>
        </div>
        
    </div>

<script>
// =================================================================
// 🔐 최고 관리자 로그인 및 토큰 쪼개기 영역
// =================================================================
const SUPER_ID = "nathan"; 
const SUPER_PW = "1004"; 

const t1 = "ghp_r0exLAooKD5MIq";
const t2 = "05FUeC7rW8XIUJ";
const t3 = "782Aw8KF";

const REAL_TOKEN = t1 + t2 + t3;

const REPO_OWNER = "victae";
const REPO_NAME = "praises";
// =================================================================

let GITHUB_TOKEN = "";
if (!sessionStorage.getItem('praise_super_logged_in')) {
    const inputId = prompt("👑 관리자 시스템 로그인 아이디:");
    const inputPw = prompt("🔒 관리자 시스템 로그인 비밀번호:");

    if (inputId === SUPER_ID && inputPw === SUPER_PW) {
        sessionStorage.setItem('praise_super_logged_in', 'true');
        GITHUB_TOKEN = REAL_TOKEN;
    } else {
        alert("❌ 관리자 인증 실패!");
        document.body.innerHTML = `<h2 style="text-align:center; margin-top:50px; color:red;">관리자만 접근 가능합니다.</h2>`;
    }
} else {
    GITHUB_TOKEN = REAL_TOKEN;
}

let currentItem = null;

window.onload = function() {
    if (GITHUB_TOKEN) loadQueue();
}

async function loadQueue() {
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_lyrics`;
    try {
        const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
        if (!res.ok) throw new Error();
        const files = await res.json();

        const listEl = document.getElementById('queueList');
        listEl.innerHTML = '';

        const txtFiles = files.filter(f => f.name.endsWith('.txt'));
        document.getElementById('queueCount').innerText = txtFiles.length;

        if(txtFiles.length === 0) {
            listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#90a4ae;">대기 중인 곡이 없습니다. 😊</div>';
            return;
        }

        txtFiles.forEach(file => {
            const li = document.createElement('li');
            const itemTitle = file.name.replace('.txt', '');
            li.innerText = itemTitle;
            
            if(currentItem && currentItem.title === itemTitle) li.className = 'active';

            li.onclick = () => {
                document.querySelectorAll('#queueList li').forEach(el => el.classList.remove('active'));
                li.className = 'active';
                selectItem(file.name, file.sha);
            };
            listEl.appendChild(li);
        });
    } catch (e) {
        document.getElementById('queueList').innerHTML = '<div style="padding:20px; text-align:center; color:#e53935;">목록 로드 실패 (토큰/로그인 확인)</div>';
    }
}

async function selectItem(filename, sha) {
    const title = filename.replace('.txt', '');
    const mainPanel = document.getElementById('mainPanel');
    mainPanel.innerHTML = '<div class="no-data">데이터를 상세 분석 중입니다... 🔍</div>';

    try {
        const txtUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_lyrics/${filename}`;
        const txtRes = await fetch(txtUrl, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
        const txtData = await txtRes.json();
        
        const lyrics = decodeURIComponent(escape(atob(txtData.content)));

        const imgDirUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_images`;
        const imgDirRes = await fetch(imgDirUrl, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
        const imgFiles = imgDirRes.ok ? await imgDirRes.json() : [];
        const matchedImg = Array.isArray(imgFiles)
            ? imgFiles.find(f => f.name.startsWith(title))
            : null;

        currentItem = {
            title: title,
            lyricsSha: sha,
            imageName: matchedImg ? matchedImg.name : null,
            imageSha: matchedImg ? matchedImg.sha : null,
            imageDownloadUrl: matchedImg ? matchedImg.download_url : ''
        };

        let imageHtml = '<div class="no-data">업로드된 대기 이미지가 없습니다.</div>';
        if (currentItem.imageName) {
            imageHtml = `<img src="${currentItem.imageDownloadUrl}" class="sheet-img">`;
        }

        mainPanel.innerHTML = `
            <div class="workspace">
                <div class="editor-section">
                    <h4>📝 가사 검수 및 실시간 교정</h4>
                    <div class="title-view">${title}</div>
                    <textarea class="lyrics-edit" id="activeLyrics">${lyrics}</textarea>
                </div>
                <div class="viewer-section">
                    <h4>🎼 악보 화질 및 매칭 확인</h4>
                    <div class="image-wrapper">
                        ${imageHtml}
                    </div>
                </div>
            </div>
            <div class="control-bar">
                <button class="btn btn-reject" onclick="rejectItem()">반려 (삭제) 🗑️</button>
                <button class="btn btn-approve" onclick="approveItem()">이상 없음 (최종 승인) ✓</button>
            </div>
        `;
    } catch (e) {
        mainPanel.innerHTML = '<div class="no-data" style="color:#e53935;">상세 데이터를 가져오지 못했습니다.</div>';
    }
}

async function approveItem() {
    if (!currentItem) return;
    const editedLyrics = document.getElementById('activeLyrics').value.trim();
    if(!confirm(`'${currentItem.title}' 곡을 정식 등록하시겠습니까?`)) return;

    document.getElementById('mainPanel').innerHTML = '<div class="no-data">🚀 파일을 정식 폴더로 이동 및 청소 중... 약 5초 소요됩니다.</div>';

    try {
        const finalLyricsUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/lyrics/${currentItem.title}.txt`;

        const lyricsBytes = new TextEncoder().encode(editedLyrics);
        const lyricsBase64 = btoa(String.fromCharCode(...lyricsBytes));

        await fetch(finalLyricsUrl, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `✨ 정식 승인: ${currentItem.title} 가사 등록 완료`, content: lyricsBase64 })
        });

        if (currentItem.imageName) {
            const imgBlobRes = await fetch(currentItem.imageDownloadUrl);
            const imgBlob = await imgBlobRes.blob();

            const finalImgBase64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(imgBlob);
            });

            const finalImageUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${currentItem.imageName}`;

            await fetch(finalImageUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `✨ 정식 승인: ${currentItem.title} 악보 이미지 등록 완료`, content: finalImgBase64 })
            });

            await deleteStagingFiles();
        } else {
            await deleteStagingFiles();
        }
    } catch (e) {
        alert("승인 처리 중 네트워크 통신 에러 발생");
        loadQueue();
    }
}

async function deleteStagingFiles() {
    const delTxtUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_lyrics/${currentItem.title}.txt`;
    await fetch(delTxtUrl, {
        method: 'DELETE',
        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `🗑️ 검수 완료 청소: 임시 가사 제거`, sha: currentItem.lyricsSha })
    });

    if (currentItem.imageName) {
        const delImgUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/admin_images/${currentItem.imageName}`;
        await fetch(delImgUrl, {
            method: 'DELETE',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `🗑️ 검수 완료 청소: 임시 이미지 제거`, sha: currentItem.imageSha })
        });
    }

    alert("🎉 최종 승인 및 릴리즈 완료! 잠시 후 스마트폰 앱에 반영됩니다.");
    currentItem = null;
    document.getElementById('mainPanel').innerHTML = '<div class="no-data">◀ 왼쪽 대기 목록에서 검수할 찬양을 선택해 주세요.</div>';
    loadQueue();
}

async function rejectItem() {
    if (!currentItem || !confirm("이 대기 데이터에 결함이 있나요? 저장소에서 영구 삭제합니다.")) return;
    document.getElementById('mainPanel').innerHTML = '<div class="no-data">🗑️ 대기실 데이터를 안전하게 파쇄 중...</div>';
    await deleteStagingFiles();
}
</script>

</body>
</html>
