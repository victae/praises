<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎼 찬양 악보 검색 라이브러리</title>
    <style>
        :root {
            --primary: #1565c0;
            --primary-light: #e3f2fd;
            --text: #263238;
            --bg: #f4f6f9;
            --border: #b0bec5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 22px; font-weight: bold; }

        .search-container {
            padding: 15px 20px;
            background: white;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            width: 100%;
            flex: 1;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-item {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #1a237e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }

        .song-item:hover, .song-item:active {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .song-item .tag {
            font-size: 15px;
            background: #e0e0e0;
            color: #37474f;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        .viewer-container {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .back-btn {
            width: 100%;
            background: #37474f;
            color: white;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .song-title-header {
            font-size: 26px;
            font-weight: bold;
            color: #0d47a1;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
        }

        .version-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: #f0f4f8;
            border: 2px solid var(--border);
            padding: 10px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            color: #37474f;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
        }

        .image-box {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .sheet-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #78909c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎼 찬양 악보 라이브러리</h1>
    </header>

    <div id="searchContainer" class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 찬양 제목 또는 가사 일부를 입력하세요..." oninput="handleSearch()">
        </div>
    </div>

    <div class="container">
        <ul id="songList" class="song-list">
            <div class="loading-text">찬양 라이브러리를 준비 중입니다... ⏳</div>
        </ul>

        <div id="viewerContainer" class="viewer-container">
            <button class="back-btn" onclick="closeViewer()">⬅ 다른 악보 검색하기</button>
            <h2 id="viewTitle" class="song-title-header">곡 제목</h2>
            <div id="versionTabs" class="version-tabs"></div>
            <div class="image-box">
                <img id="viewImage" class="sheet-image" src="" alt="악보 이미지" style="display:none;">
                <div id="noImageText" style="color:#90a4ae; padding:40px; font-weight:bold; font-size:20px; display:none;">
                    등록된 악보 이미지가 없습니다. 😭
                </div>
            </div>
        </div>
    </div>

<script>
    const REPO_OWNER = "victae";
    const REPO_NAME = "praises";

    let rawData = [];      // ccm_data.json 원본 데이터
    let songsList = [];    // 검색 최적화 인덱스 배열

    window.onload = async function() {
        await loadJsonData();
    };

    // 🚀 찬송가 앱처럼 1개의 JSON 파일만 직통으로 읽어와 초고속 초기화
    async function loadJsonData() {
        const listEl = document.getElementById('songList');
        try {
            // 캐시 방지 파라미터(?v=...)를 붙여 항상 최신 ccm_data.json 로드
            const res = await fetch(`ccm_data.json?v=${Date.now()}`);
            if (!res.ok) throw new Error("JSON 로드 실패");
            
            rawData = await res.json();
            
            // JSON 포맷이 배열 형태이든 객체 형태이든 유연하게 파싱
            if (Array.isArray(rawData)) {
                songsList = rawData.map(item => parseSongItem(item));
            } else {
                songsList = Object.keys(rawData).map(key => parseSongItem(rawData[key], key));
            }

            renderSongList(songsList.slice(0, 50)); // 초기 로딩 시 상위 50곡 우선 렌더링
        } catch (e) {
            listEl.innerHTML = '<div class="loading-text" style="color:red;">ccm_data.json을 불러오지 못했습니다.<br>파일 위치와 이름을 확인해 주세요.</div>';
        }
    }

    // JSON 항목 정규화 파서
    function parseSongItem(item, keyName = "") {
        const title = (item.title || keyName || item.name || "").normalize('NFC');
        const lyrics = (item.lyrics || item.content || item.text || "").normalize('NFC');
        
        // 악보 이미지 파일 목록 추출 (배열 또는 단일 파일명 대응)
        let images = [];
        if (item.images && Array.isArray(item.images)) {
            images = item.images;
        } else if (item.image) {
            images = [item.image];
        } else if (item.filename) {
            images = [item.filename];
        } else {
            // 별도 이미지 필드가 없는 경우 기본 확장자 추정 매칭
            images = [`${title}.jpg`];
        }

        return {
            title: title,
            lyrics: lyrics,
            images: images
        };
    }

    // 📋 검색 목록 렌더링
    function renderSongList(songs) {
        const listEl = document.getElementById('songList');
        listEl.innerHTML = '';

        if (songs.length === 0) {
            listEl.innerHTML = '<div class="loading-text">일치하는 찬양이 없습니다. 😊</div>';
            return;
        }

        songs.forEach(song => {
            const li = document.createElement('li');
            li.className = 'song-item';
            li.innerHTML = `
                <span>🎼 ${song.title}</span>
                <span class="tag">악보 보기 ➔</span>
            `;
            li.onclick = () => openViewer(song);
            listEl.appendChild(li);
        });
    }

    // 🔍 제목 + 가사 내용 통합 초고속 실시간 검색
    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase().normalize('NFC');
        
        if (!query) {
            renderSongList(songsList.slice(0, 50));
            return;
        }

        const filtered = songsList.filter(song => 
            song.title.toLowerCase().includes(query) || 
            song.lyrics.toLowerCase().includes(query)
        );

        renderSongList(filtered.slice(0, 100)); // 검색 결과 최대 100개 쾌속 렌더링
    }

    // 🎼 악보 뷰어 열기 (탭 자동 분기)
    function openViewer(song) {
        document.getElementById('searchContainer').style.display = 'none';
        document.getElementById('songList').style.display = 'none';
        document.getElementById('viewerContainer').style.display = 'block';
        document.getElementById('viewTitle').innerText = song.title;

        const tabsEl = document.getElementById('versionTabs');
        tabsEl.innerHTML = '';

        if (song.images && song.images.length > 0) {
            song.images.forEach((imgName, index) => {
                const nameNoExt = imgName.substring(0, imgName.lastIndexOf('.')) || imgName;
                let sourceTag = "일반 악보";

                if (nameNoExt.includes('-')) {
                    sourceTag = nameNoExt.split('-').slice(1).join('-');
                }

                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = `🎼 ${sourceTag}`;
                
                // GitHub raw 이미지 직접 링크
                const imgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/${encodeURIComponent(imgName)}`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showImage(imgUrl);
                };
                tabsEl.appendChild(btn);
            });

            const firstImgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/${encodeURIComponent(song.images[0])}`;
            showImage(firstImgUrl);
        } else {
            showImage(null);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showImage(url) {
        const imgEl = document.getElementById('viewImage');
        const noImgText = document.getElementById('noImageText');

        if (url) {
            imgEl.src = url;
            imgEl.style.display = 'block';
            noImgText.style.display = 'none';
        } else {
            imgEl.style.display = 'none';
            noImgText.style.display = 'block';
        }
    }

    function closeViewer() {
        document.getElementById('viewerContainer').style.display = 'none';
        document.getElementById('searchContainer').style.display = 'block';
        document.getElementById('songList').style.display = 'flex';
    }
</script>

</body>
</html>
