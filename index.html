<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎼 찬양 악보 검색 라이브러리</title>
    <style>
        :root {
            --primary: #1565c0;
            --primary-light: #e3f2fd;
            --text: #263238;
            --bg: #f4f6f9;
            --border: #b0bec5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 22px; font-weight: bold; }

        .search-container {
            padding: 15px 20px;
            background: white;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            width: 100%;
            flex: 1;
        }

        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-item {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #1a237e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }

        .song-item:hover, .song-item:active {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .song-item .tag {
            font-size: 15px;
            background: #e0e0e0;
            color: #37474f;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        .viewer-container {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .back-btn {
            width: 100%;
            background: #37474f;
            color: white;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .song-title-header {
            font-size: 26px;
            font-weight: bold;
            color: #0d47a1;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
        }

        .version-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: #f0f4f8;
            border: 2px solid var(--border);
            padding: 10px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            color: #37474f;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
        }

        .image-box {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .sheet-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #78909c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎼 찬양 악보 라이브러리</h1>
    </header>

    <div id="searchContainer" class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 찬양 제목 또는 가사 일부를 입력하세요..." oninput="handleSearch()">
        </div>
    </div>

    <div class="container">
        <ul id="songList" class="song-list">
            <div class="loading-text">찬양 라이브러리를 준비 중입니다... ⏳</div>
        </ul>

        <div id="viewerContainer" class="viewer-container">
            <button class="back-btn" onclick="closeViewer()">⬅ 다른 악보 검색하기</button>
            <h2 id="viewTitle" class="song-title-header">곡 제목</h2>
            <div id="versionTabs" class="version-tabs"></div>
            <div class="image-box">
                <img id="viewImage" class="sheet-image" src="" alt="악보 이미지" style="display:none;">
                <div id="noImageText" style="color:#90a4ae; padding:40px; font-weight:bold; font-size:20px; display:none;">
                    등록된 악보 이미지가 없습니다. 😭
                </div>
            </div>
        </div>
    </div>

<script>
    const REPO_OWNER = "victae";
    const REPO_NAME = "praises";

    let songsList = [];

    window.onload = async function() {
        await loadJsonData();
    };

    // 🚀 ccm_data.json 단일 파일 로드 (초고속 캐싱)
    async function loadJsonData() {
        const listEl = document.getElementById('songList');
        try {
            const res = await fetch(`ccm_data.json?v=${Date.now()}`);
            if (!res.ok) throw new Error("JSON 로드 실패");
            
            songsList = await res.json();
            renderSongList(songsList.slice(0, 50));
        } catch (e) {
            listEl.innerHTML = '<div class="loading-text" style="color:red;">ccm_data.json을 불러오지 못했습니다.<br>make_json.py 실행 여부를 확인해 주세요.</div>';
        }
    }

    function renderSongList(songs) {
        const listEl = document.getElementById('songList');
        listEl.innerHTML = '';

        if (songs.length === 0) {
            listEl.innerHTML = '<div class="loading-text">일치하는 찬양이 없습니다. 😊</div>';
            return;
        }

        songs.forEach(song => {
            const count = song.images ? song.images.length : 0;
            const li = document.createElement('li');
            li.className = 'song-item';
            li.innerHTML = `
                <span>🎼 ${song.title}</span>
                <span class="tag">악보 ${count}개 ➔</span>
            `;
            li.onclick = () => openViewer(song);
            listEl.appendChild(li);
        });
    }

    // 🔍 제목 + 가사 본문 통합 실시간 검색
    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase().replace(/\s+/g, '');
        
        if (!query) {
            renderSongList(songsList.slice(0, 50));
            return;
        }

        const filtered = songsList.filter(song => {
            const matchTitle = song.title.toLowerCase().replace(/\s+/g, '').includes(query);
            const matchLyrics = song.lyrics && song.lyrics.toLowerCase().replace(/\s+/g, '').includes(query);
            return matchTitle || matchLyrics;
        });

        renderSongList(filtered.slice(0, 100));
    }

    // 🎼 악보 뷰어 및 출처 탭(찬2000, 물소리 등) 자동 변환
    function openViewer(song) {
        document.getElementById('searchContainer').style.display = 'none';
        document.getElementById('songList').style.display = 'none';
        document.getElementById('viewerContainer').style.display = 'block';
        document.getElementById('viewTitle').innerText = song.title;

        const tabsEl = document.getElementById('versionTabs');
        tabsEl.innerHTML = '';

        if (song.images && song.images.length > 0) {
            song.images.forEach((imgName, index) => {
                const nameNoExt = imgName.substring(0, imgName.lastIndexOf('.')) || imgName;
                
                // 🏷️ 출처명 축약 파싱 (찬미예수2000 -> 찬2000, 많은 물소리 -> 물소리)
                let tag = "일반";
                if (nameNoExt.includes('-')) {
                    tag = nameNoExt.split('-').slice(1).join('-');
                } else if (nameNoExt.includes('_')) {
                    tag = '#' + nameNoExt.split('_').slice(1).join('_');
                }

                tag = tag.replace(/찬미예수\s*2000|찬미예수/g, '찬2000')
                         .replace(/많은\s*물소리/g, '물소리');

                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = `🎼 ${tag}`;
                
                const imgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/${encodeURIComponent(imgName)}`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showImage(imgUrl);
                };
                tabsEl.appendChild(btn);
            });

            const firstImgUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/${encodeURIComponent(song.images[0])}`;
            showImage(firstImgUrl);
        } else {
            showImage(null);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showImage(url) {
        const imgEl = document.getElementById('viewImage');
        const noImgText = document.getElementById('noImageText');

        if (url) {
            imgEl.src = url;
            imgEl.style.display = 'block';
            noImgText.style.display = 'none';
        } else {
            imgEl.style.display = 'none';
            noImgText.style.display = 'block';
        }
    }

    function closeViewer() {
        document.getElementById('viewerContainer').style.display = 'none';
        document.getElementById('searchContainer').style.display = 'block';
        document.getElementById('songList').style.display = 'flex';
    }
</script>

</body>
</html>
