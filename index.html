<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎼 찬양 악보 검색 라이브러리</title>
    <style>
        :root {
            --primary: #1565c0;
            --primary-light: #e3f2fd;
            --text: #263238;
            --bg: #f4f6f9;
            --border: #b0bec5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 🟦 상단 헤더 */
        header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 22px; font-weight: bold; }

        /* 🔍 검색창 구역 (악보 화면에서는 동적으로 숨김 처리됨) */
        .search-container {
            padding: 15px 20px;
            background: white;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* 🟩 메인 데이터 컨테이너 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            width: 100%;
            flex: 1;
        }

        /* 📋 찬양 검색 결과 목록 */
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-item {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #1a237e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }

        .song-item:hover, .song-item:active {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .song-item .tag {
            font-size: 15px;
            background: #e0e0e0;
            color: #37474f;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 🎼 대형 악보 전용 뷰어 화면 (점선 박스 제거, 풀사이즈 적용) */
        .viewer-container {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* 악보 화면에서 상단 이동 전용 대형 버튼 */
        .back-btn {
            width: 100%;
            background: #37474f;
            color: white;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .song-title-header {
            font-size: 26px;
            font-weight: bold;
            color: #0d47a1;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
        }

        /* 🏷️ 찬미예수2000, 물소리 등 출처 선택 탭 */
        .version-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: #f0f4f8;
            border: 2px solid var(--border);
            padding: 10px 20px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            color: #37474f;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
        }

        /* 🖼️ 점선 테두리 제거! 악보 원본 크기 극대화 뷰어 */
        .image-box {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .sheet-image {
            width: 100%;       /* 박스 여백 없이 화면에 꽉 차게 연출 */
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #78909c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎼 찬양 악보 라이브러리</h1>
    </header>

    <!-- 🔍 검색창 구역 (악보 열면 숨겨짐) -->
    <div id="searchContainer" class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 찬양 제목을 입력하세요 (예: 호산나, 하나복)..." oninput="handleSearch()">
        </div>
    </div>

    <div class="container">
        <!-- 📋 찬양 목록 -->
        <ul id="songList" class="song-list">
            <div class="loading-text">저장소의 전체 악보 데이터를 불러오는 중... ⏳</div>
        </ul>

        <!-- 🎼 악보 전용 대형 뷰어 -->
        <div id="viewerContainer" class="viewer-container">
            <button class="back-btn" onclick="closeViewer()">⬅ 다른 악보 검색하기</button>
            <h2 id="viewTitle" class="song-title-header">곡 제목</h2>

            <!-- 🏷️ 악보 출처 탭 (찬미예수2000, 물소리 등) -->
            <div id="versionTabs" class="version-tabs"></div>

            <!-- 🖼️ 점선 제거 완료된 순수 대형 악보 출력 구역 -->
            <div class="image-box">
                <img id="viewImage" class="sheet-image" src="" alt="악보 이미지" style="display:none;">
                <div id="noImageText" style="color:#90a4ae; padding:40px; font-weight:bold; font-size:20px; display:none;">
                    등록된 악보 이미지가 없습니다. 😭
                </div>
            </div>
        </div>
    </div>

<script>
    const REPO_OWNER = "victae";
    const REPO_NAME = "praises";

    let groupedSongs = {}; // Key: 찬양제목, Value: 악보파일목록 배열

    window.onload = async function() {
        await loadAllSheetMusic();
    };

    // 🚀 [수리] 깃허브 전체 트리 스캔 방식을 적용하여 수천 개의 파일도 누락 없이 100% 수집
    async function loadAllSheetMusic() {
        const listEl = document.getElementById('songList');
        try {
            // recursive=1 옵션으로 images/ 폴더 안의 모든 파일 목록을 한 번에 싹 긁어옵니다.
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`);
            if (!res.ok) throw new Error("전체 데이터 로드 실패");
            
            const data = await res.json();
            groupedSongs = {};

            // images/ 폴더 내부의 이미지 파일만 정밀 추출
            const imageFiles = data.tree.filter(item => 
                item.path.startsWith('images/') && 
                /\.(jpg|jpeg|png|gif|webp)$/i.test(item.path)
            );

            imageFiles.forEach(file => {
                // 경로에서 파일명만 추출 (예: "images/호산나-물소리.jpg" -> "호산나-물소리.jpg")
                const fileName = file.path.replace('images/', '');
                const nameNoExt = fileName.substring(0, fileName.lastIndexOf('.'));
                
                // 한글 유니코드 정규화 (자음/모음 분리현상 완벽 방지)
                const normalizedName = nameNoExt.normalize('NFC');

                let mainTitle = normalizedName;
                let sourceTag = "일반 악보";

                if (normalizedName.includes('-')) {
                    const parts = normalizedName.split('-');
                    mainTitle = parts[0].trim();
                    sourceTag = parts.slice(1).join('-').trim();
                }

                if (!groupedSongs[mainTitle]) {
                    groupedSongs[mainTitle] = [];
                }

                // GitHub Raw Image URL 직접 생성
                const downloadUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${file.path}`;

                groupedSongs[mainTitle].push({
                    fullFileName: fileName,
                    sourceTag: sourceTag,
                    downloadUrl: downloadUrl
                });
            });

            renderSongList(Object.keys(groupedSongs));
        } catch (e) {
            listEl.innerHTML = '<div class="loading-text" style="color:red;">악보 전체 목록을 불러오지 못했습니다. 네트워크를 확인해 주세요.</div>';
        }
    }

    // 📋 검색 목록 출력
    function renderSongList(songTitles) {
        const listEl = document.getElementById('songList');
        listEl.innerHTML = '';

        if (songTitles.length === 0) {
            listEl.innerHTML = '<div class="loading-text">일치하는 악보가 없습니다. 😊</div>';
            return;
        }

        // 가나다 순 정렬
        songTitles.sort((a, b) => a.localeCompare(b, 'ko')).forEach(title => {
            const versionsCount = groupedSongs[title].length;
            const li = document.createElement('li');
            li.className = 'song-item';
            li.innerHTML = `
                <span>🎼 ${title}</span>
                <span class="tag">악보 ${versionsCount}개 ➔</span>
            `;
            li.onclick = () => openViewer(title);
            listEl.appendChild(li);
        });
    }

    // 🔍 지능형 실시간 검색 (호산나, 하나복 등 완벽 감지)
    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase().normalize('NFC');
        const allTitles = Object.keys(groupedSongs);

        if (!query) {
            renderSongList(allTitles);
            return;
        }

        const filtered = allTitles.filter(title => {
            const normTitle = title.toLowerCase().normalize('NFC');
            const titleMatch = normTitle.includes(query);
            const sourceMatch = groupedSongs[title].some(item => 
                item.sourceTag.toLowerCase().normalize('NFC').includes(query)
            );
            return titleMatch || sourceMatch;
        });

        renderSongList(filtered);
    }

    // 🎼 대형 악보 전용 뷰어 열기
    function openViewer(songTitle) {
        // 검색창과 목록 숨김 ➔ 악보 뷰어 띄우기
        document.getElementById('searchContainer').style.display = 'none';
        document.getElementById('songList').style.display = 'none';
        document.getElementById('viewerContainer').style.display = 'block';
        document.getElementById('viewTitle').innerText = songTitle;

        const versions = groupedSongs[songTitle] || [];
        const tabsEl = document.getElementById('versionTabs');
        tabsEl.innerHTML = '';

        if (versions.length > 0) {
            versions.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = `🎼 ${item.sourceTag}`;
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showImage(item.downloadUrl);
                };
                tabsEl.appendChild(btn);
            });

            showImage(versions[0].downloadUrl);
        } else {
            showImage(null);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 악보 이미지 표시
    function showImage(url) {
        const imgEl = document.getElementById('viewImage');
        const noImgText = document.getElementById('noImageText');

        if (url) {
            imgEl.src = url;
            imgEl.style.display = 'block';
            noImgText.style.display = 'none';
        } else {
            imgEl.style.display = 'none';
            noImgText.style.display = 'block';
        }
    }

    // ⬅ [다른 악보 검색하기] 누르면 검색 화면으로 복귀
    function closeViewer() {
        document.getElementById('viewerContainer').style.display = 'none';
        document.getElementById('searchContainer').style.display = 'block';
        document.getElementById('songList').style.display = 'flex';
    }
</script>

</body>
</html>
