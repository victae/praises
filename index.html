<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎼 찬양 악보 검색 라이브러리</title>
    <style>
        :root {
            --primary: #1565c0;
            --primary-light: #e3f2fd;
            --accent: #2e7d32;
            --text: #263238;
            --bg: #f4f6f9;
            --border: #b0bec5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 🟦 Header */
        header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 24px; font-weight: bold; }

        /* 🔍 Search Input Area */
        .search-container {
            padding: 15px 20px;
            background: white;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* 🟩 Main Layout Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        /* 📋 Song List */
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-item {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #1a237e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }

        .song-item:hover, .song-item:active {
            background-color: var(--primary-light);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .song-item .tag {
            font-size: 15px;
            background: #e0e0e0;
            color: #37474f;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 🎼 Viewer Container */
        .viewer-container {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .back-btn {
            background: #455a64;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .song-title-header {
            font-size: 28px;
            font-weight: bold;
            color: #0d47a1;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-light);
            padding-bottom: 15px;
        }

        /* 🏷️ Source Tabs */
        .version-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            background: #f0f4f8;
            border: 2px solid var(--border);
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            color: #37474f;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
        }

        /* 🎼 Sheet Music Display Box */
        .image-box {
            background: #fafafa;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed var(--border);
            text-align: center;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sheet-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #78909c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎼 찬양 악보 라이브러리</h1>
    </header>

    <!-- 🔍 Search Box -->
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 찬양 제목을 입력하세요 (예: 호산나)..." oninput="handleSearch()">
        </div>
    </div>

    <div class="container">
        <!-- 📋 Song List -->
        <ul id="songList" class="song-list">
            <div class="loading-text">악보 데이터를 불러오는 중입니다... ⏳</div>
        </ul>

        <!-- 🎼 Sheet Music Viewer -->
        <div id="viewerContainer" class="viewer-container">
            <button class="back-btn" onclick="closeViewer()">⬅ 목록으로 돌아가기</button>
            <h2 id="viewTitle" class="song-title-header">곡 제목</h2>

            <!-- 🏷️ Source Tabs -->
            <div id="versionTabs" class="version-tabs"></div>

            <!-- 🖼️ Image Box -->
            <div class="image-box">
                <img id="viewImage" class="sheet-image" src="" alt="악보 이미지" style="display:none;">
                <div id="noImageText" style="color:#90a4ae; padding:40px; font-weight:bold; font-size:20px; display:none;">
                    등록된 악보 이미지가 없습니다. 😭
                </div>
            </div>
        </div>
    </div>

<script>
    const REPO_OWNER = "victae";
    const REPO_NAME = "praises";

    let groupedSongs = {}; // Key: Unique Song Title, Value: Array of image files

    window.onload = async function() {
        await loadSheetMusic();
    };

    // Index sheet music images directly from the GitHub images/ folder
    async function loadSheetMusic() {
        const listEl = document.getElementById('songList');
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images`);
            if (!res.ok) throw new Error("Failed to load images");
            
            const files = await res.json();
            groupedSongs = {};

            files.forEach(file => {
                // Filter only image files
                if (/\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)) {
                    // Extract name without extension
                    const nameNoExt = file.name.substring(0, file.name.lastIndexOf('.'));
                    
                    // Separate song title and source tag (e.g., "호산나-찬미예수2000" -> mainTitle: "호산나", sourceTag: "찬미예수2000")
                    let mainTitle = nameNoExt;
                    let sourceTag = "일반 악보";

                    if (nameNoExt.includes('-')) {
                        const parts = nameNoExt.split('-');
                        mainTitle = parts[0].trim();
                        sourceTag = parts.slice(1).join('-').trim();
                    }

                    if (!groupedSongs[mainTitle]) {
                        groupedSongs[mainTitle] = [];
                    }

                    groupedSongs[mainTitle].push({
                        fullFileName: file.name,
                        sourceTag: sourceTag,
                        downloadUrl: file.download_url
                    });
                }
            });

            renderSongList(Object.keys(groupedSongs));
        } catch (e) {
            listEl.innerHTML = '<div class="loading-text" style="color:red;">악보 데이터를 불러오지 못했습니다. (저장소/네트워크 확인)</div>';
        }
    }

    // Render song list
    function renderSongList(songTitles) {
        const listEl = document.getElementById('songList');
        listEl.innerHTML = '';

        if (songTitles.length === 0) {
            listEl.innerHTML = '<div class="loading-text">검색된 악보가 없습니다. 😊</div>';
            return;
        }

        // Sort titles alphabetically
        songTitles.sort().forEach(title => {
            const versionsCount = groupedSongs[title].length;
            const li = document.createElement('li');
            li.className = 'song-item';
            li.innerHTML = `
                <span>🎼 ${title}</span>
                <span class="tag">악보 ${versionsCount}개 ➔</span>
            `;
            li.onclick = () => openViewer(title);
            listEl.appendChild(li);
        });
    }

    // Real-time search
    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const allTitles = Object.keys(groupedSongs);

        if (!query) {
            renderSongList(allTitles);
            return;
        }

        const filtered = allTitles.filter(title => {
            // Match against song title or source tags
            const titleMatch = title.toLowerCase().includes(query);
            const sourceMatch = groupedSongs[title].some(item => item.sourceTag.toLowerCase().includes(query));
            return titleMatch || sourceMatch;
        });

        renderSongList(filtered);
    }

    // Open viewer with tabs for different versions
    function openViewer(songTitle) {
        document.getElementById('songList').style.display = 'none';
        document.getElementById('viewerContainer').style.display = 'block';
        document.getElementById('viewTitle').innerText = songTitle;

        const versions = groupedSongs[songTitle] || [];
        const tabsEl = document.getElementById('versionTabs');
        tabsEl.innerHTML = '';

        if (versions.length > 0) {
            versions.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = `🎼 ${item.sourceTag}`;
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showImage(item.downloadUrl);
                };
                tabsEl.appendChild(btn);
            });

            showImage(versions[0].downloadUrl);
        } else {
            showImage(null);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showImage(url) {
        const imgEl = document.getElementById('viewImage');
        const noImgText = document.getElementById('noImageText');

        if (url) {
            imgEl.src = url;
            imgEl.style.display = 'inline-block';
            noImgText.style.display = 'none';
        } else {
            imgEl.style.display = 'none';
            noImgText.style.display = 'block';
        }
    }

    function closeViewer() {
        document.getElementById('viewerContainer').style.display = 'none';
        document.getElementById('songList').style.display = 'flex';
    }
</script>

</body>
</html>
